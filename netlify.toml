# Konfiguracja deployu trzymana w repozytorium, a nie wyklikana w panelu -
# dzięki temu build jest odtwarzalny i widać w gicie, co się zmieniło.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # 22, nie 20: Next 16 wymaga >= 20.9.0, ale @netlify/plugin-nextjs
  # potrzebuje już 22+. Przy ustawieniu 20 Netlify i tak uruchamiał
  # wtyczkę na 22 i zgłaszał ostrzeżenie o niezgodności - lepiej mieć
  # jedną wersję dla całego builda niż liczyć na to obejście.
  NODE_VERSION = "22"

  # Turbopack zapisuje w swoim cache kompilacji snapshot zmiennych
  # środowiskowych, więc skaner Netlify znajduje tam SMTP_PASS i przerywa
  # build. Sprawdzone: hasła NIE MA ani w paczkach dla przeglądarki, ani
  # w kodzie funkcji serwerowej - tylko w .sst, czyli w cache, którego
  # Netlify nie serwuje, a jedynie przechowuje między budowaniami.
  #
  # Wyłączamy z skanowania wyłącznie ten katalog. Reszta - w tym to, co
  # realnie trafia na serwer - jest skanowana dalej.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

# Oficjalna wtyczka Next.js - obsługuje trasy serwerowe, Server Actions
# i odświeżanie kalendarza co 15 minut.
[[plugins]]
  package = "@netlify/plugin-nextjs"
